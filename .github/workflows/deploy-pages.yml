name: Deploy to GitHub Pages

# Builds the PWA on every push to `main` and publishes `dist/` to GitHub
# Pages. The custom domain (md-studio.struktureretsundfornuft.dk) is bound
# by `public/CNAME`, which Vite copies into `dist/` on every build, so it
# survives each deploy. `workflow_dispatch` allows a manual re-deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one active deployment at a time; a follow-up push waits for
# the running deploy instead of aborting a live-traffic environment mid-way.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
