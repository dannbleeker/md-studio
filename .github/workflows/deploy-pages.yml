name: Deploy to GitHub Pages

# Builds the PWA on every push to `main` and publishes `dist/` to GitHub
# Pages. The custom domain (md-studio.struktureretsundfornuft.dk) is bound
# by `public/CNAME`, which Vite copies into `dist/` on every build, so it
# survives each deploy. `workflow_dispatch` allows a manual re-deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The Rebuild-book and Stats workflows commit generated files (EPUB/PDF,
  # stats.json) back to main with GITHUB_TOKEN, and GitHub raises no `push`
  # event for those commits. Re-deploy when they finish so the live site
  # serves the refreshed files.
  workflow_run:
    workflows: ['Rebuild book artifacts', 'Stats']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one active deployment at a time; a follow-up push waits for
# the running deploy instead of aborting a live-traffic environment mid-way.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build dist
    # On a workflow_run trigger, only deploy if that workflow succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Always build main's tip: a workflow_run hands over the commit that
        # triggered it, which predates the bot's generated-files commit.
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
