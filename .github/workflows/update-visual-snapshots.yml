name: Update visual snapshots

# Refreshes the Playwright visual-regression baselines
# (e2e/visual.spec.ts-snapshots/*.png) on the CI runner, which is the only
# place they can come from: screenshots taken on Windows or macOS render
# fonts differently and never match. Opens a PR with the new PNGs; review
# the images, then merge to accept them as the new baseline.
#
# Run it after an intentional visual change (theme, layout, typography), or
# once at the start to create the first baselines.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests".

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to refresh snapshots against.'
        required: false
        default: 'main'

jobs:
  refresh:
    name: Refresh visual snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.branch }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Refresh baselines
        env:
          REFRESH_VISUAL_SNAPSHOTS: '1'
        run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots

      - name: Commit + PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore: refresh visual snapshot baselines'
          title: 'chore: refresh visual snapshot baselines'
          body: |
            Generated by the `Update visual snapshots` workflow.
            Each changed PNG is a difference between the old baseline and this
            run. Merging accepts the new rendering as the baseline.
          branch: chore/update-visual-snapshots
          delete-branch: true
          add-paths: |
            e2e/**/*.png
